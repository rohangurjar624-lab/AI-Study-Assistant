name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff black

    - name: Code formatting check (black)
      run: |
        black --check app config.py run.py seed.py tests/ || true

    - name: Linting (ruff)
      run: |
        ruff check app config.py run.py seed.py tests/ || true

    - name: Run tests with pytest & coverage
      env:
        FLASK_ENV: testing
        SECRET_KEY: test-key-123456789
      run: |
        pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=60
