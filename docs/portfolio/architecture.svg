<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="100%" height="100%" style="background:#0b1120; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="grad-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="500" y="40" text-anchor="middle" fill="#f8fafc" font-size="24" font-weight="800" letter-spacing="1">AI STUDY ASSISTANT &bull; ARCHITECTURE</text>
  <text x="500" y="65" text-anchor="middle" fill="#94a3b8" font-size="13">Modular Flask 3 App Factory with Dual AI/NLP Engine &amp; Spaced Repetition</text>

  <!-- Layer 1: Client -->
  <rect x="50" y="100" width="900" height="75" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="70" y="125" fill="#38bdf8" font-size="12" font-weight="700">PRESENTATION LAYER (CLIENT INTERFACE)</text>
  <g transform="translate(70, 138)">
    <rect x="0" y="0" width="180" height="26" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="90" y="17" text-anchor="middle" fill="#f8fafc" font-size="11">Responsive HTML5/CSS</text>

    <rect x="200" y="0" width="180" height="26" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="290" y="17" text-anchor="middle" fill="#f8fafc" font-size="11">Vanilla JS (No heavy SPA)</text>

    <rect x="400" y="0" width="180" height="26" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="490" y="17" text-anchor="middle" fill="#f8fafc" font-size="11">Chart.js Analytics CDN</text>

    <rect x="600" y="0" width="240" height="26" rx="5" fill="#0f172a" stroke="#38bdf8" stroke-width="1"/>
    <text x="720" y="17" text-anchor="middle" fill="#f8fafc" font-size="11">CSRF Form &amp; Timer Ticker</text>
  </g>

  <!-- Down Arrow -->
  <line x1="500" y1="175" x2="500" y2="205" stroke="#d4af37" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="495,205 505,205 500,212" fill="#d4af37"/>

  <!-- Layer 2: Flask Web & Blueprints -->
  <rect x="50" y="215" width="900" height="110" rx="10" fill="#1e293b" stroke="#d4af37" stroke-width="1.5"/>
  <text x="70" y="240" fill="#d4af37" font-size="12" font-weight="700">APPLICATION LAYER &bull; FLASK 3 APP FACTORY &amp; BLUEPRINTS</text>
  <g transform="translate(70, 255)">
    <rect x="0" y="0" width="150" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="75" y="24" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Auth Blueprint</text>
    <text x="75" y="42" text-anchor="middle" fill="#94a3b8" font-size="10">Flask-Login / Scrypt</text>

    <rect x="170" y="0" width="150" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="245" y="24" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Notes Blueprint</text>
    <text x="245" y="42" text-anchor="middle" fill="#94a3b8" font-size="10">Upload / Extract / List</text>

    <rect x="340" y="0" width="150" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="415" y="24" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Quiz Blueprint</text>
    <text x="415" y="42" text-anchor="middle" fill="#94a3b8" font-size="10">Safe Server Scoring</text>

    <rect x="510" y="0" width="160" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="590" y="24" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Flashcards Blueprint</text>
    <text x="590" y="42" text-anchor="middle" fill="#94a3b8" font-size="10">SM-2 Spaced Recall</text>

    <rect x="690" y="0" width="160" height="55" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="770" y="24" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">Dashboard / Profile</text>
    <text x="770" y="42" text-anchor="middle" fill="#94a3b8" font-size="10">Analytics JSON &amp; Stats</text>
  </g>

  <!-- Down Arrow -->
  <line x1="500" y1="325" x2="500" y2="355" stroke="#10b981" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="495,355 505,355 500,362" fill="#10b981"/>

  <!-- Layer 3: Services (Pure Business Logic) -->
  <rect x="50" y="365" width="900" height="120" rx="10" fill="#1e293b" stroke="#10b981" stroke-width="1.5"/>
  <text x="70" y="390" fill="#10b981" font-size="12" font-weight="700">SERVICES LAYER &bull; PURE FUNCTIONS &amp; DUAL STUDY ENGINE</text>
  <g transform="translate(70, 405)">
    <rect x="0" y="0" width="190" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="95" y="25" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">extract.py</text>
    <text x="95" y="42" text-anchor="middle" fill="#94a3b8" font-size="10">pypdf &amp; txt extractor</text>
    <text x="95" y="55" text-anchor="middle" fill="#94a3b8" font-size="9">Scanned PDF detection</text>

    <rect x="210" y="0" width="200" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="310" y="25" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">llm.py (Primary)</text>
    <text x="310" y="42" text-anchor="middle" fill="#94a3b8" font-size="10">Anthropic Claude API</text>
    <text x="310" y="55" text-anchor="middle" fill="#94a3b8" font-size="9">Strict JSON validation &amp; retry</text>

    <rect x="430" y="0" width="200" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="530" y="25" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">nlp.py (Fallback)</text>
    <text x="530" y="42" text-anchor="middle" fill="#94a3b8" font-size="10">TF-IDF Term Scoring</text>
    <text x="530" y="55" text-anchor="middle" fill="#94a3b8" font-size="9">Deterministic sentence rank</text>

    <rect x="650" y="0" width="200" height="65" rx="6" fill="#0f172a" stroke="#334155"/>
    <text x="750" y="25" text-anchor="middle" fill="#f8fafc" font-size="12" font-weight="600">srs.py (SM-2)</text>
    <text x="750" y="42" text-anchor="middle" fill="#94a3b8" font-size="10">SuperMemo SM-2</text>
    <text x="750" y="55" text-anchor="middle" fill="#94a3b8" font-size="9">Interval &amp; Ease calculation</text>
  </g>

  <!-- Down Arrow -->
  <line x1="500" y1="485" x2="500" y2="515" stroke="#a855f7" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="495,515 505,515 500,522" fill="#a855f7"/>

  <!-- Layer 4: Persistence -->
  <rect x="50" y="525" width="900" height="85" rx="10" fill="#1e293b" stroke="#a855f7" stroke-width="1.5"/>
  <text x="70" y="550" fill="#a855f7" font-size="12" font-weight="700">PERSISTENCE LAYER &bull; RELATIONAL DATA &amp; MIGRATIONS</text>
  <g transform="translate(70, 562)">
    <rect x="0" y="0" width="260" height="36" rx="5" fill="#0f172a" stroke="#334155"/>
    <text x="130" y="23" text-anchor="middle" fill="#f8fafc" font-size="11">Flask-SQLAlchemy 3 + Alembic Migrations</text>

    <rect x="280" y="0" width="260" height="36" rx="5" fill="#0f172a" stroke="#334155"/>
    <text x="410" y="23" text-anchor="middle" fill="#f8fafc" font-size="11">SQLite (Dev) / PostgreSQL (Prod)</text>

    <rect x="560" y="0" width="300" height="36" rx="5" fill="#0f172a" stroke="#334155"/>
    <text x="710" y="23" text-anchor="middle" fill="#f8fafc" font-size="11">Indexed FKs &amp; ON DELETE CASCADE Cleanups</text>
  </g>
</svg>
